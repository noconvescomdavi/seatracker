name: SeaTracker CI + Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :apps:android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: seatracker-android-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
