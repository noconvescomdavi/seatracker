name: Fix CM93 origin
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/fix-cm93-origin.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chart-providers/cm93/src/lib.rs')
          s=p.read_text().replace('(self.latitude_index as f64 - 240.0) / 3.0','(self.latitude_index as f64 - 270.0) / 3.0')
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chart-providers/cm93/src/lib.rs
          git commit -m 'fix(cm93): use correct cell latitude origin'
          git push origin HEAD:main
