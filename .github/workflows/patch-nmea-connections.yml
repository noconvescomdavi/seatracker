name: Patch NMEA connection manager
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-nmea-connections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch MainActivity
        run: python3 tools/patch_main_nmea.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/src/main/java/com/noconves/seatracker/MainActivity.java
          git commit -m 'feat(android-nmea): add persisted TCP connection manager'
          git push origin HEAD:main
