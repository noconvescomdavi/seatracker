name: Publish SeaTracker Android

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-functional-apk.yml'
      - 'apps/android/**'
      - 'core/**'
      - 'chart-providers/**'
      - 'renderer/**'
      - 'simulator/**'
      - 'Cargo.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  publish:
    needs: validate-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Android lint
        run: gradle :apps:android:lintDebug --stacktrace
      - name: Build installable APK
        run: gradle :apps:android:assembleDebug --stacktrace
      - name: Prepare release
        shell: bash
        run: |
          cp apps/android/build/outputs/apk/debug/android-debug.apk SeaTracker-1.0.0.apk
          echo "TAG=seatracker-1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" SeaTracker-1.0.0.apk \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "SeaTracker 1.0.0 Android" \
            --notes "SeaTracker ECS/chartplotter Android build. Operational offline raster MBTiles chart display, native GPS/GNSS position and stale-fix protection, own-ship, persisted waypoints/routes/tracks, MOB, cursor bearing/range and EBL/VRM. Core also contains NMEA/AIS/CPA-TCPA, voyage, chart catalog/quilt, KAP/S-57 structural providers and isolated S-63/CM93/NV2 research boundaries. Not a certified ECDIS. S-57 portrayal, KAP raster decoding and NV2 rendering are not claimed as operational in this Android build."
