name: Publish functional APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-functional-apk.yml'
      - 'apps/android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Android lint
        run: gradle :apps:android:lintDebug --stacktrace

      - name: Build APK
        run: gradle :apps:android:assembleDebug --stacktrace

      - name: Prepare APK name
        shell: bash
        run: |
          cp apps/android/build/outputs/apk/debug/android-debug.apk SeaTracker-0.2.0-functional.apk
          echo "TAG=seatracker-functional-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" SeaTracker-0.2.0-functional.apk             --repo "${{ github.repository }}"             --target "$GITHUB_SHA"             --title "SeaTracker 0.2.0 Functional"             --notes "Functional Android build: GPS acquisition and stale-fix protection, own-ship position on the map, local raster MBTiles chart loading, route plotting and persistence, track and MOB. Not a certified ECDIS."
