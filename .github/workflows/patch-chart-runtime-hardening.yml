name: Patch chart runtime hardening
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/patch-chart-runtime-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/android/src/main/java/com/noconves/seatracker/MainActivity.java')
          s=p.read_text()
          old='''            autoSelectKapForPosition(lastNmeaPosition);\n        }'''
          new='''            autoSelectKapForPosition(lastNmeaPosition);\n            autoSelectCm93ForPosition(lastNmeaPosition);\n        }'''
          if old not in s:
              raise SystemExit('NMEA chart-selection anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/src/main/java/com/noconves/seatracker/MainActivity.java
          git commit -m 'fix(android-charts): auto-select CM93 from NMEA position'
          git push origin HEAD:main
